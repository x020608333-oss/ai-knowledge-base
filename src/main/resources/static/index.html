<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 知识库问答 · SSE 演示</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    .box { border: 1px solid #e3e3e3; border-radius: 10px; padding: 12px; margin-top: 12px; }
    #log { white-space: pre-wrap; min-height: 180px; line-height: 1.6; }
    input, button { padding: 10px 12px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; }
    #question { width: 70%; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; }
    button:disabled { background: #9db4f0; cursor: not-allowed; }
    .src { color: #888; font-size: 12px; margin-top: 8px; border-top: 1px dashed #ddd; padding-top: 8px; }
    .tip { color: #888; font-size: 12px; margin-top: 8px; }
    .upload-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .upload-status { font-size: 12px; margin-top: 8px; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <h1>🧠 AI 智能知识库问答平台 · SSE 流式演示</h1>
  <div class="box">
    <input id="question" placeholder="请输入你的问题，例如：公司的年假制度是什么？" />
    <button id="send">提问</button>
    <div class="tip">先通过 <code>POST /api/kb/upload</code> 上传文档并等待处理完成，再提问即可获得基于知识库的回答。</div>
  </div>

  <div class="box">
    <div><b>① 上传知识库文档</b></div>
    <div class="upload-row" style="margin-top:8px">
      <input type="file" id="file" accept=".pdf,.docx,.md,.txt" />
      <button id="upload">上传并向量化</button>
    </div>
    <div id="uploadStatus" class="upload-status">支持 PDF / DOCX / MD / TXT；上传后在后台异步解析与向量化，请留意下方状态。</div>
  </div>

  <div class="box"><div id="log">回答将在这里流式输出...</div><div id="src" class="src"></div></div>

<script>
  const log = document.getElementById('log');
  const src = document.getElementById('src');
  const btn = document.getElementById('send');
  const input = document.getElementById('question');
  const marker = '__REFERENCES__';
  const sessionMarker = '__SESSION__';
  let sessionId = localStorage.getItem('kb_session') || '';

  async function send() {
    const question = input.value.trim();
    if (!question) return;
    btn.disabled = true;
    log.textContent = '';
    src.innerHTML = '';

    // 使用 fetch 读取 SSE 流（EventSource 不支持 POST）
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, question })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let body = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // 最后一段可能不完整
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const chunk = line.slice(5).trim();
        if (chunk.startsWith(sessionMarker)) {
          // 首次对话由后端新建会话并回传，写入 localStorage 供后续轮次复用
          sessionId = chunk.slice(sessionMarker.length).trim();
          localStorage.setItem('kb_session', sessionId);
          continue;
        }
        if (chunk.startsWith(marker)) {
          const refs = JSON.parse(chunk.slice(marker.length));
          renderRefs(refs);
        } else {
          body += chunk;
          log.textContent = body;
        }
      }
    }
    btn.disabled = false;
  }

  function renderRefs(refs) {
    // 文件名/片段来自用户上传的文档，必须用 textContent 渲染，避免存储型 XSS
    src.textContent = '';
    const title = document.createElement('b');
    title.textContent = '引用来源：';
    src.appendChild(title);
    src.appendChild(document.createElement('br'));
    refs.forEach(r => {
      const line = document.createElement('div');
      const score = typeof r.score === 'number' ? r.score.toFixed(3) : String(r.score ?? '');
      const page = r.page ? `第${r.page}页 · ` : '';
      line.textContent = `[${r.index}] ${page}${r.fileName}（相似度 ${score}）：${r.snippet}`;
      src.appendChild(line);
    });
  }

  btn.onclick = send;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  // ===== 文档上传 =====
  const fileInput = document.getElementById('file');
  const uploadBtn = document.getElementById('upload');
  const uploadStatus = document.getElementById('uploadStatus');

  async function upload() {
    const f = fileInput.files[0];
    if (!f) { setUploadStatus('请先选择一个文件', 'err'); return; }
    uploadBtn.disabled = true;
    setUploadStatus('正在上传，请稍候...', '');
    try {
      const form = new FormData();
      form.append('file', f);   // 字段名必须为 file，与后端 @RequestParam("file") 对应
      const resp = await fetch('/api/kb/upload', { method: 'POST', body: form });
      const json = await resp.json();
      if (json && json.code === 200) {
        const d = json.data || {};
        setUploadStatus(`上传成功：${f.name}（docId=${d.docId}）。文档正在后台解析与向量化，请稍等约 10~30 秒再提问。`, 'ok');
      } else {
        setUploadStatus('上传失败：' + ((json && json.message) || resp.status), 'err');
      }
    } catch (e) {
      setUploadStatus('上传出错：' + e.message, 'err');
    } finally {
      uploadBtn.disabled = false;
    }
  }

  function setUploadStatus(msg, cls) {
    uploadStatus.textContent = msg;
    uploadStatus.className = 'upload-status ' + (cls || '');
  }

  uploadBtn.onclick = upload;
</script>
</body>
</html>
